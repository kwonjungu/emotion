<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 감정 글쓰기 나라 🌈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Jua', sans-serif;
  background: linear-gradient(135deg, #fff3e0, #e8f5e9, #e3f2fd, #fce4ec);
  background-size: 400% 400%;
  animation: gradientBG 8s ease infinite;
  min-height: 100vh;
  overflow-x: hidden;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== 헤더 ===== */
.header {
  text-align: center;
  padding: 30px 20px 10px;
}

.header h1 {
  font-size: 2.5rem;
  color: #e91e63;
  text-shadow: 2px 2px 0 #fce4ec;
  animation: bounce 2s ease infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.header p {
  font-size: 1.2rem;
  color: #7b1fa2;
  margin-top: 5px;
}

/* ===== 메인 버튼 영역 ===== */
.main-buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
}

.main-btn {
  font-family: 'Jua', sans-serif;
  font-size: 1.5rem;
  padding: 20px 40px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  position: relative;
  overflow: hidden;
}

.main-btn:hover {
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.main-btn:active {
  transform: translateY(0) scale(0.98);
}

.btn-topic {
  background: linear-gradient(135deg, #ff6f00, #ffa726);
  color: white;
}

.btn-emotion {
  background: linear-gradient(135deg, #7b1fa2, #ce93d8);
  color: white;
}

/* ===== 주제 섹션 ===== */
.topic-section {
  text-align: center;
  padding: 20px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.topic-display {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.topic-display.active {
  display: flex;
}

.topic-label {
  font-size: 1.3rem;
  color: #e65100;
}

.topic-text {
  font-size: 2.8rem;
  color: #d32f2f;
  background: white;
  padding: 25px 50px;
  border-radius: 30px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  border: 4px dashed #ffab91;
  opacity: 0;
  transform: scale(0);
  transition: none;
}

.topic-text.show {
  animation: topicAppear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes topicAppear {
  0% { opacity: 0; transform: scale(0) rotate(-10deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(5deg); }
  70% { transform: scale(0.9) rotate(-3deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.topic-tip {
  font-size: 1.1rem;
  color: #6a1b9a;
  background: #f3e5f5;
  padding: 15px 25px;
  border-radius: 20px;
  max-width: 500px;
  line-height: 1.6;
  opacity: 0;
}

.topic-tip.show {
  animation: fadeUp 0.5s ease forwards;
  animation-delay: 1s;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.writing-area {
  width: 90%;
  max-width: 600px;
  margin-top: 15px;
  opacity: 0;
}

.writing-area.show {
  animation: fadeUp 0.5s ease forwards;
  animation-delay: 1.5s;
}

.writing-area textarea {
  font-family: 'Jua', sans-serif;
  width: 100%;
  min-height: 200px;
  padding: 20px;
  font-size: 1.3rem;
  border: 3px solid #ffcc80;
  border-radius: 20px;
  resize: vertical;
  outline: none;
  line-height: 1.8;
  background: #fffde7;
}

.writing-area textarea:focus {
  border-color: #ff9800;
  box-shadow: 0 0 15px rgba(255, 152, 0, 0.3);
}

.writing-area textarea::placeholder {
  color: #bcaaa4;
}

/* ===== 팡파레 ===== */
.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1000;
}

.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  top: -20px;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) scale(0); opacity: 0; }
}

/* ===== 감정 카드 오버레이 ===== */
.emotion-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.97);
  z-index: 2000;
  overflow-y: auto;
  animation: overlayIn 0.4s ease;
}

.emotion-overlay.active {
  display: block;
}

@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.emotion-header {
  text-align: center;
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.95);
  z-index: 10;
  backdrop-filter: blur(10px);
}

.emotion-header-content {
  padding: 20px 20px 10px;
  overflow: hidden;
  max-height: 200px;
  transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
  opacity: 1;
}

.emotion-header-content.hidden {
  max-height: 0;
  padding: 0 20px;
  opacity: 0;
}

.toggle-header-btn {
  font-family: 'Jua', sans-serif;
  font-size: 1rem;
  padding: 8px 24px;
  border: none;
  background: linear-gradient(135deg, #7b1fa2, #ce93d8);
  color: white;
  border-radius: 0 0 20px 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 5px;
}

.toggle-header-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(123,31,162,0.3);
}

.emotion-header h2 {
  font-size: 2.5rem;
  color: #7b1fa2;
}

.close-btn {
  font-family: 'Jua', sans-serif;
  font-size: 1.2rem;
  padding: 10px 30px;
  border: none;
  background: linear-gradient(135deg, #ef5350, #e91e63);
  color: white;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 10px;
  transition: transform 0.2s;
}

.close-btn:hover {
  transform: scale(1.05);
}

.emotion-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px 25px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.emotion-card {
  background: white;
  border-radius: 20px;
  padding: 25px 15px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  border: 3px solid transparent;
  user-select: none;
}

.emotion-card:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.emotion-card.selected {
  border-color: #e91e63;
  background: #fce4ec;
}

.emotion-card .emoji {
  font-size: 4.5rem;
  display: block;
  margin-bottom: 10px;
  animation: cardPop 0.5s ease backwards;
}

.emotion-card .name {
  font-size: 1.8rem;
  color: #333;
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

.emotion-card .desc {
  font-size: 1.1rem;
  color: #888;
  line-height: 1.4;
}

@keyframes cardPop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

/* ===== 두둥 텍스트 ===== */
.dudung {
  font-size: 4rem;
  color: #ff6f00;
  text-shadow: 3px 3px 0 #ffe0b2;
  opacity: 0;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 3000;
  pointer-events: none;
}

.dudung.show {
  animation: dudungAnim 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes dudungAnim {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.5) rotate(10deg); }
  50% { transform: translate(-50%, -50%) scale(1.2) rotate(-5deg); }
  70% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(2) rotate(0deg); }
}

/* ===== 별 반짝이 ===== */
.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 1.5rem;
  animation: sparkleFade 0.8s ease forwards;
}

@keyframes sparkleFade {
  0% { opacity: 1; transform: scale(0) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
  100% { opacity: 0; transform: scale(0) rotate(360deg); }
}

/* ===== 반응형 ===== */
@media (max-width: 600px) {
  .header h1 { font-size: 1.8rem; }
  .main-btn { font-size: 1.2rem; padding: 15px 25px; }
  .topic-text { font-size: 2rem; padding: 20px 30px; }
  .emotion-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .emotion-card .emoji { font-size: 3.5rem; }
  .emotion-card .name { font-size: 1.4rem; }
  .emotion-card .desc { font-size: 0.95rem; }
}
</style>
</head>

<div class="header">
  <h1>🌈 감정 글쓰기 나라 🌈</h1>

</div>

<!-- 메인 버튼 -->
<div class="main-buttons">
  <button class="main-btn btn-topic" onclick="generateTopic()">✏️ 주제 만들기</button>

<!-- 효과음용 (Web Audio API) -->
<script>
// ===== 효과음 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playFanfare() {
  const ctx = getAudioCtx();
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + i * 0.15);
    osc.stop(ctx.currentTime + i * 0.15 + 0.5);
  });
}

function playPop() {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

// ===== 팡파레 효과 =====
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#e91e63','#ff5722','#ff9800','#ffeb3b','#4caf50','#2196f3','#9c27b0','#00bcd4'];
  const shapes = ['●','★','♥','♦','▲','◆','✦','🎉'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (Math.random() * 16 + 10) + 'px';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    container.appendChild(el);
  }
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

// ===== 주제 만들기 =====
let isAnimating = false;

function generateTopic() {
  if (isAnimating) return;
  isAnimating = true;

  const display = document.getElementById('topicDisplay');
  const textEl = document.getElementById('topicText');
  const labelEl = document.getElementById('topicLabel');
  const tipEl = document.getElementById('topicTip');
  const writingArea = document.getElementById('writingArea');
  const dudung = document.getElementById('dudung');

  // 초기화
  textEl.classList.remove('show');
  tipEl.classList.remove('show');
  writingArea.classList.remove('show');
  display.classList.remove('active');

  // 두둥! 등장
  dudung.classList.remove('show');
  void dudung.offsetWidth;
  dudung.classList.add('show');
  playFanfare();
  launchConfetti();

  // 주제 선택
  const topic = topics[Math.floor(Math.random() * topics.length)];

  setTimeout(() => {
    display.classList.add('active');
    labelEl.textContent = "오늘의 주제는~?";
    textEl.textContent = topic.text;
    tipEl.textContent = "💡 " + topic.tip;

    void textEl.offsetWidth;
    textEl.classList.add('show');
    tipEl.classList.add('show');
    writingArea.classList.add('show');

    isAnimating = false;
  }, 800);
}

// ===== 감정 카드 =====
function openEmotions() {
  const overlay = document.getElementById('emotionOverlay');
  const grid = document.getElementById('emotionGrid');
  grid.innerHTML = '';

  emotions.forEach((emo, i) => {
    const card = document.createElement('div');
    card.className = 'emotion-card';
    card.style.backgroundColor = emo.color;
    card.innerHTML = `
      <span class="emoji" style="animation-delay:${i * 0.05}s">${emo.emoji}</span>
      <span class="name">${emo.name}</span>
      <span class="desc">${emo.desc}</span>
    `;
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      playPop();
      // 반짝이 효과
      for (let j = 0; j < 5; j++) {
        createSparkle(
          card.getBoundingClientRect().left + card.offsetWidth / 2 + (Math.random() - 0.5) * 60,
          card.getBoundingClientRect().top + card.offsetHeight / 2 + (Math.random() - 0.5) * 60
        );
      }
    });
    grid.appendChild(card);
  });

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeEmotions() {
  document.getElementById('emotionOverlay').classList.remove('active');
  document.body.style.overflow = '';
  // 닫을 때 헤더 다시 보이게 초기화
  document.getElementById('emotionHeaderContent').classList.remove('hidden');
  document.getElementById('toggleHeaderBtn').textContent = '▲ 위 숨기기';
}

function toggleEmotionHeader() {
  const content = document.getElementById('emotionHeaderContent');
  const btn = document.getElementById('toggleHeaderBtn');
  content.classList.toggle('hidden');
  if (content.classList.contains('hidden')) {
    btn.textContent = '▼ 위 보이기';
  } else {
    btn.textContent = '▲ 위 숨기기';
  }
}

function createSparkle(x, y) {
  const sparkle = document.createElement('div');
  sparkle.className = 'sparkle';
  sparkle.textContent = ['✨','⭐','💫','🌟'][Math.floor(Math.random() * 4)];
  sparkle.style.left = x + 'px';
  sparkle.style.top = y + 'px';
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 800);
}

// ===== 커서 반짝이 효과 =====
document.addEventListener('mousemove', (e) => {
  if (Math.random() > 0.95) {
    createSparkle(e.clientX, e.clientY);
  }
});
